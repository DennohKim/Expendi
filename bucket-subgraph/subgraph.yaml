specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ExpendiBucketManager
    network: base-sepolia
    source:
      address: "0x4832FE3192f205F753F1C334916B7cfec7823D64"
      abi: ExpendiBucketManager
      startBlock: 32577148
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Bucket
        - Subscription
        - User
        - Payment
        - Deposit
        - Withdrawal
        - BucketBalanceHistory
        - MonthlySpending
        - UserActivity
        - SecurityEvent
        - SubscriptionAnalytics
      abis:
        - name: ExpendiBucketManager
          file: ./abis/ExpendiBucketManager.json
      eventHandlers:
        - event: BucketCreated(indexed address,indexed string,uint256,uint256,uint256)
          handler: handleBucketCreated
        - event: BucketFunded(indexed address,indexed string,uint256,indexed address,uint256,uint256,uint256)
          handler: handleBucketFunded
        - event: BucketDeleted(indexed address,indexed string,uint256,uint256)
          handler: handleBucketDeleted
        - event: OneTimePaymentMade(indexed address,indexed string,uint256,indexed address,address,string,uint256,uint256,uint256,uint256)
          handler: handleOneTimePaymentMade
        - event: BucketSubscriptionCreated(indexed address,indexed string,indexed uint256,uint256,uint256,address,address,uint256,bool,string,uint256,uint256)
          handler: handleBucketSubscriptionCreated
        - event: BucketSubscriptionCharged(indexed address,indexed string,indexed uint256,uint256,address,address,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleBucketSubscriptionCharged
        - event: BucketSubscriptionCancelled(indexed address,indexed string,indexed uint256,uint256,uint256,uint256,uint256)
          handler: handleBucketSubscriptionCancelled
        - event: BucketSubscriptionPaused(indexed address,indexed string,indexed uint256,uint256,uint256)
          handler: handleBucketSubscriptionPaused
        - event: BucketSubscriptionResumed(indexed address,indexed string,indexed uint256,uint256,uint256)
          handler: handleBucketSubscriptionResumed
        - event: MonthlyLimitReset(indexed address,indexed string,uint256,uint256,uint256,uint256,uint256)
          handler: handleMonthlyLimitReset
        - event: MonthlyLimitUpdated(indexed address,indexed string,uint256,uint256,uint256,uint256)
          handler: handleMonthlyLimitUpdated
        - event: BucketBalanceChanged(indexed address,indexed string,indexed address,uint256,uint256,uint256,string,uint256,uint256)
          handler: handleBucketBalanceChanged
        - event: BucketMonthlySpendingUpdated(indexed address,indexed string,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleBucketMonthlySpendingUpdated
        - event: EmergencyPause(indexed address,bool,uint256,uint256)
          handler: handleEmergencyPause
        - event: SecurityEvent(indexed address,indexed string,string,uint256,uint256)
          handler: handleSecurityEvent
        - event: UserActivity(indexed address,indexed string,string,uint256,indexed address,uint256,uint256)
          handler: handleUserActivity
        - event: SubscriptionAnalytics(indexed address,indexed uint256,indexed string,uint256,uint256,uint256,address,uint256,uint256)
          handler: handleSubscriptionAnalytics
      file: ./src/mapping.ts